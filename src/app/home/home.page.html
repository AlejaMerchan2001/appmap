<ion-header>
  <ion-toolbar>
    <ion-title>Registro de ubicación con fotos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div id="map" style="width: 100%; height: 100%;"></div>

  <ion-button
    expand="block"
    (click)="registrarAqui()"
    style="position:absolute; bottom:16px; left:16px; right:16px; z-index:1000;">
    Registrar en mi ubicación actual
  </ion-button>

  <ion-modal #modal [initialBreakpoint]="0.6" [breakpoints]="[0, 0.6, 0.9]">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Nuevo registro</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="cerrarModal()">Cancelar</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">
        <ion-img
          *ngIf="fotoTemporal"
          [src]="fotoTemporal"
          style="border-radius:8px; margin-bottom:16px;">
        </ion-img>

        <ion-item>
          <ion-label position="stacked">Nota</ion-label>
          <ion-textarea
            [(ngModel)]="notaTemporal"
            placeholder="Escribe una nota sobre este lugar..."
            rows="3">
          </ion-textarea>
        </ion-item>

        <ion-button expand="block" (click)="guardarRegistro()" style="margin-top:16px;">
          Guardar registro
        </ion-button>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
